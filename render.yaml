services:
  - type: web
    name: petcita-frontend
    env: static
    buildCommand: pnpm install --no-frozen-lockfile && pnpm --filter @workspace/petcita build
    staticPublishPath: artifacts/petcita/dist/public
    envVars:
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: VITE_API_URL
        value: https://petcita.onrender.com
      - key: BASE_PATH
        value: /
